<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="05 · Payment Service CD: Update values.yaml">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset=".5" stop-color="#05071a"/><stop offset="1" stop-color="#03070f"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset=".35" stop-color="#fdba74"/><stop offset=".7" stop-color="#4ade80"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="ggold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ffb800" stop-opacity=".78"/></linearGradient><linearGradient id="ggreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#16a34a" stop-opacity=".78"/></linearGradient><linearGradient id="gorange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#f97316" stop-opacity=".78"/></linearGradient><linearGradient id="gred" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#e11d48" stop-opacity=".78"/></linearGradient><linearGradient id="gteal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#0d9488" stop-opacity=".78"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feFlood flood-color="#22d3ee" flood-opacity=".8"/><feComposite in2="b" operator="in" result="h"/><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font: 900 30px 'Segoe UI', Arial, sans-serif; fill: url(#tg); }
      .sub { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #c7d2fe; }
      .ct { font: 900 22px 'Segoe UI', Arial, sans-serif; fill: #000000; }
      .cs { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #000000; }
      .lbl { font: 900 14px 'Segoe UI', Arial, sans-serif; }
      .foot { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #c7d2fe; }
      .flow { fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 10 8; animation: flow .8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#e0f2fe"/></marker>
  </defs>
  <rect width="1100" height="700" fill="url(#bg)"/>
  <text x="550.0" y="44" text-anchor="middle" class="title">05 · Payment Service CD: Update values.yaml</text>
  <text x="550.0" y="72" text-anchor="middle" class="sub">sed rewrites the image repository and tag in place</text>
  <g class="card" filter="url(#glow)"><rect x="40" y="130" width="230" height="120" rx="14" fill="url(#ggold)" stroke="#fde047" stroke-width="2.5"/></g>
<text x="155.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">Before</text>
<text x="155.0" y="208.7" text-anchor="middle" class="cs" style="font-size:16.0px">old repo + old tag</text>
<g class="card" filter="url(#glow)"><rect x="310" y="130" width="230" height="120" rx="14" fill="url(#gorange)" stroke="#fdba74" stroke-width="2.5"/></g>
<text x="425.0" y="188.0" text-anchor="middle" class="ct" style="font-size:20.8px">sed: repository</text>
<text x="425.0" y="207.7" text-anchor="middle" class="cs" style="font-size:16.0px">s|repository:.*|...|</text>
<g class="card" filter="url(#glow)"><rect x="580" y="130" width="230" height="120" rx="14" fill="url(#gred)" stroke="#fb7185" stroke-width="2.5"/></g>
<text x="695.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">sed: tag</text>
<text x="695.0" y="208.7" text-anchor="middle" class="cs" style="font-size:16.0px">s|tag:.*|...|</text>
<g class="card" filter="url(#glow)"><rect x="850" y="130" width="230" height="120" rx="14" fill="url(#ggreen)" stroke="#4ade80" stroke-width="2.5"/></g>
<text x="965.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">After</text>
<text x="965.0" y="208.7" text-anchor="middle" class="cs" style="font-size:16.0px">new repo + new tag</text>
<g class="card" filter="url(#glow)"><rect x="580" y="305" width="230" height="120" rx="14" fill="url(#gteal)" stroke="#2dd4bf" stroke-width="2.5"/></g>
<text x="695.0" y="363.0" text-anchor="middle" class="ct" style="font-size:20.8px">cat values.yaml</text>
<text x="695.0" y="382.7" text-anchor="middle" class="cs" style="font-size:16.0px">printed in the run log</text>
<path id="p0" class="flow" d="M270.0,190.0 L310.0,190.0" stroke="#fde047" marker-end="url(#arr)"/>
<path id="p1" class="flow" d="M540.0,190.0 L580.0,190.0" stroke="#fdba74" marker-end="url(#arr)"/>
<path id="p2" class="flow" d="M810.0,190.0 L850.0,190.0" stroke="#fb7185" marker-end="url(#arr)"/>
<path id="p3" class="flow" d="M695.0,250.0 L695.0,305.0" stroke="#fb7185" marker-end="url(#arr)"/>
  <text x="550.0" y="648" text-anchor="middle" class="foot">Before: old repository and tag in envs/&lt;env&gt;/values.yaml</text><text x="550.0" y="670" text-anchor="middle" class="foot">sed replaces the repository line and the tag line</text><text x="550.0" y="692" text-anchor="middle" class="foot">After: the new image is written to the file Argo CD reads</text>
