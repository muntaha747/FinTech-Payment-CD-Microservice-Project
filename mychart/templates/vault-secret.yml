# MySQL creds come from Vault (Vault Secrets Operator).
# VSO reads the Vault path and creates the k8s Secret <fullname>-mysql-creds
# with keys: username, password, rootpassword, database
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ include "mychart.fullname" . }}-vault-connection
spec:
  address: {{ .Values.vault.address }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "mychart.fullname" . }}-vault-auth
spec:
  vaultConnectionRef: {{ include "mychart.fullname" . }}-vault-connection
  method: kubernetes
  mount: {{ .Values.vault.authMount }}
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: {{ include "mychart.serviceAccountName" . }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "mychart.fullname" . }}-mysql-creds
spec:
  vaultAuthRef: {{ include "mychart.fullname" . }}-vault-auth
  type: kv-v2
  mount: {{ .Values.vault.kvMount }}
  path: {{ .Values.vault.mysqlPath }}
  refreshAfter: 30s
  destination:
    name: {{ include "mychart.fullname" . }}-mysql-creds
    create: true
